<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM Learn</title>
    <style>
        button {
            margin: 20px;
            border-radius: 5px;
            height: 50px;
            width: auto;
            background-color: cyan;
        }

        button:hover {
            background-color: rgb(0, 199, 199);
        }

        body {
            height: 100vh;
            background-image: linear-gradient(to bottom, grey, transparent);
        }
    </style>
</head>

<body>


    <button onclick="youtube()">For Youtube</button>
    <!-- كود الـ function في السطر الـ28 في صفحة الجافاسكريبت -->

    <button onclick="back()">Back Page</button>
    <!-- كود الـ function في السطر الـ38 في صفحة الجافاسكريبت -->

    <button onclick="forward()">Forward Page</button>
    <!-- كود الـ function في السطر الـ43 في صفحة الجافاسكريبت -->

    <button onclick="openWin()">Open New Window</button>
    <!-- كود الـ function في السطر الـ77 في صفحة الجافاسكريبت -->

    <button onclick="closeWin()">close the New Window</button>
    <!-- كود الـ function في السطر الـ83 في صفحة الجافاسكريبت -->

    <button onclick="reSizeOne()">Resize One Time</button>
    <!-- كود الـ function في السطر الـ90 في صفحة الجافاسكريبت -->

    <button onclick="reSizeMore()">Resize More Than Time</button>
    <!-- كود الـ function في السطر الـ95 في صفحة الجافاسكريبت -->

    <button onclick="move()">move</button>
    <!-- كود الـ function في السطر الـ100 في صفحة الجافاسكريبت -->

    <button onclick="scrollWin()">scroll</button>
    <!-- كود الـ function في السطر الـ106 في صفحة الجافاسكريبت -->

</body>
<script src="BOM.js"></script>

</html>
