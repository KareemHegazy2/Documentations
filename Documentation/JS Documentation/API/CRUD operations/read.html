<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read</title>
    <style>
        table {
            width: 100%;
            border: 2px solid black;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="tbody">


        </tbody>
    </table>
</body>
<script>



    let xhr = new XMLHttpRequest(); // 0

let id = location.search.slice(1).split("=")[1];


    xhr.open('GET', `https://6aa53dc21397053d42bb89a3.mockapi.io/DEPI/depi/${id}`);

    xhr.send();
    const data = [];
    xhr.addEventListener('readystatechange', () => {

        if (xhr.readyState == 4 && xhr.status == 200) {

            let data = JSON.parse(xhr.responseText);

            document.getElementById('tbody').innerHTML += `
        <tr>
          <td>${data.id}</td>
          <td>${data.name}</td>
          <td>${data.Email}</td>
        </tr>
      `;

        }

    })



</script>

</html>
